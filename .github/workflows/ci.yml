name: CI

on:
  push:
    branches:
      - main
      - "case/**"
      - "chore/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest
      - name: Lint
        run: python -m ruff check case_ltv/src tests
      - name: Compile
        run: python -m compileall -q case_ltv/src
